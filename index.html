  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n        Prevenção de verdade. Sem dor, sem susto e sem surpresa no bolso.\n      <\u002Fp>\n\n      <!-- SEARCH CARD -->\n      <div style=\"background:#fff;border:2px solid #0A1530;border-radius:22px;box-shadow:10px 10px 0 0 #0A1530;padding:22px;margin-top:36px;text-align:left;\">\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n          <div style=\"position:relative;flex:1 1 300px;\">\n            <svg style=\"position:absolute;left:16px;top:50%;transform:translateY(-50%);\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#1F7AB8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"><\u002Fline><\u002Fsvg>\n            <input type=\"text\" placeholder=\"Busque por cidade, bairro ou nome do dentista...\" value=\"{{ query }}\" onchange=\"{{ onQuery }}\" onkeydown=\"{{ onKey }}\" style=\"width:100%;padding:15px 16px 15px 46px;border:2px solid #0A1530;border-radius:12px;background:#F2EBDA;font-size:15px;font-weight:600;color:#0A1530;\">\n          <\u002Fdiv>\n          <button onclick=\"{{ onGeo }}\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:9px;flex:0 0 auto;background:#0F1E3F;color:#fff;border:2px solid #0A1530;border-radius:12px;padding:0 20px;font-weight:700;font-size:13.5px;cursor:pointer;box-shadow:0 4px 0 #000;transition:transform .14s,box-shadow .14s;\" style-hover=\"transform:translateY(-2px);box-shadow:0 6px 0 #000;\">\n            <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#3FB6FF\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><\u002Fsvg>\n            Usar minha localização\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex erif;font-weight:700;font-stretch:90%;letter-spacing:-0.02em;font-size:24px;color:#0A1530;margin:0 0 8px;\">Ainda não temos dentistas STOP nessa região<\u002Fh3>\n        <p style=\"font-size:15px;color:#6C7798;margin:0 0 22px;max-width:440px;margin-left:auto;margin-right:auto;\">Que tal buscar em uma cidade próxima? Estamos crescendo rápido — em breve teremos um Dentista Stop perto de você.<\u002Fp>\n        <button onclick=\"{{ onClear }}\" style=\"display:inline-flex;align-items:center;gap:8px;background:#3FB6FF;color:#0A1530;border:2px solid #0A1530;border-radius:12px;padding:13px 24px;font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;box-shadow:0 4px 0 #1F7AB8;transition:transform .14s,box-shadow .14s;\" style-hover=\"transform:translateY(-2px);box-shadow:0 6px 0 #1F7AB8;\">Ver todos os dentistas<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ============ O QUE É O STOP ============ -->\n  <section style=\"position:relative;background-color:#0A1530;background-image:radial-gradient(circle at 80% 20%,rgba(63,182,255,.16),transparent 50%),radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:auto,22px 22px;border-bottom:2px solid #0A1530;padding:80px 0;\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:48px;align-items:center;\">\n      <div>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#3FB6FF;margin-bottom:16px;\">O método<\u002Fdiv>\n        <h2 style=\"font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-stretch:90%;letter-spacing:-0.03em;line-height:1.04;font-size:clamp(32px,4vw,52px);color:#fff;margin:0 0 20px;\">O que é um <span style=\"background:linear-gradient(180deg,transparent 58%,rgba(63,182,255,.5) 58%);padding:0 .06em;\">Dentista Stop ) ? 12 : (s.uf ? 7 : 4);\n    const mapSrc = 'https://www.google.com/maps?q=' + encodeURIComponent(mapPlace) + '&z=' + mapZoom + '&output=embed';\n    const vis = s.vis || 12;\n    const pagedResults = results.slice(0, vis);\n    const hasMore = results.length > vis;\n    const moreLabel = 'Carregar mais — ver +' + Math.min(12, results.length - vis) + ' (de ' + results.length + ')';\n    const f = s.form || {};\n    const teamList = stored.map(d => ({\n      ...d,\n      initials: this.initials(d.name),\n      metaLine: d.cro + ' · ' + d.bairro + ', ' + d.cidade + '/' + d.uf,\n      onRemove: () => this.removeDentist(d.id)\n    }));\n    return {\n      tickerLoop: [...this.data.ticker, ...this.data.ticker],\n      stats: statsArr,\n      dentistCount: brandCount,\n      mapSrc,\n      pagedResults,\n      hasMore,\n      moreLabel,\n      onMore: () => this.setState(st => ({ vis: (st.vis || 12) + 12 })),\n      benefits: this.data.benefits,\n      ufOptions,\n      bairroOptions,\n      query: s.query,\n      uf: s.uf,\n      bairro: s.bairro,\n      results,\n      resultTitle,\n      skeleton: [0, 1, 2, 3],\n      isSearching: s.searching,\n      showGrid: !s.searching && n > 0,\n      showEmpty: !s.searching && n === 0,\n      showTicker: p.showTicker !== false,\n      showMap: p.showMap !== false,\n      showWa: p.showFloatingWhatsapp !== false,\n      onQuery: e => this.setState({ query: e.target.value, vis: 12 }),\n      onUf: e => this.setState({ uf: e.target.value, bairro: '', vis: 12, hasSearched: true }),\n      onBairro: e => this.setState({ bairro: e.target.value, vis: 12, hasSearched: true }),\n      onKey: e => { if (e.key === 'Enter') this.doSearch(); },\n      onSearch: () => this.doSearch(),\n      onGeo: () => { this.setState({ query: 'Pinheiros, São Paulo', vis: 12 }); this.doSearch(); },\n      onClear: () => this.setState({ query: '', uf: '', bairro: '', vis: 12, hasSearched: true }),\n\n      showAdmin: s.view === 'admin',\n      authed: s.aut
